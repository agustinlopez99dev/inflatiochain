spring.application.name=inflatiochain

# CoinGecko
coingecko.base-url=https://api.coingecko.com/api/v3
coingecko.user-agent=Mozilla/5.0
# Optional demo key (header x-cg-demo-api-key); leave empty to use the public tier
coingecko.api-key=
coingecko.history-days=365
# Free tier: only the first page (top 250) is requested; raise if you have a paid plan
coingecko.list-pages=1

# Cache
inflatiochain.cache.summary-ttl=5m
inflatiochain.cache.summary-max-size=500
inflatiochain.cache.coin-list-ttl=1d
# Last-known-good copies served (flagged stale=true) when CoinGecko fails
inflatiochain.cache.stale-ttl=7d

# Background refresh of the top coins. Each coin costs 2 CoinGecko calls, so throttle ~8 req/min.
inflatiochain.prewarm.enabled=true
inflatiochain.prewarm.top-n=15
inflatiochain.prewarm.interval=5m
inflatiochain.prewarm.initial-delay=30s
inflatiochain.prewarm.throttle=15s
inflatiochain.prewarm.cooldown=2m

# Per-IP rate limit on /api/**
inflatiochain.rate-limit.enabled=true
inflatiochain.rate-limit.requests-per-minute=60
# Only enable behind a trusted proxy; otherwise clients can spoof X-Forwarded-For
inflatiochain.rate-limit.trust-forwarded-for=false

management.endpoints.web.exposure.include=health,info
